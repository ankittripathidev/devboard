# Goal: To deploy the build Image from CI Steps one the CI workflow is Succeeded

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: 
      - advanced

jobs:
  deploy:
   # Deploy only when CI succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7 

      - name: Copy Example env to Main env
        run: cp .env.example .env 
      
      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Deploy the Container with Docker Compose
        run: |
          docker compose pull
          docker compose up -d
